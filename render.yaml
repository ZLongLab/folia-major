# 当前文件：Render 一键部署入口，只部署独立网易云接口。
services:
  - type: web
    name: folia-netease-zlonglab
    repo: https://github.com/ZLongLab/folia-major
    branch: codex/android-xiaomi-0.7.19
    autoDeployTrigger: off
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/android-netease/Dockerfile
    dockerContext: ./deploy/android-netease
    healthCheckPath: /healthz
    envVars:
      - key: ENABLE_GENERAL_UNBLOCK
        value: "false"
      - key: CORS_ALLOW_ORIGIN
        value: https://localhost
